# Releases @den-ai/devsite from main. semantic-release computes the version from the commits since the last release tag (fix -> patch, feat -> minor, a `!` after the type or a BREAKING CHANGE footer -> major), pushes the tag, writes GitHub release notes, and publishes to npm — or exits without releasing when nothing releasable landed.
# package.json stays at 0.0.0 on purpose: the real version lives in git tags and on npm, so no release commits ever land on main.
# Auth is trusted publishing (OIDC): npmjs.com trusts this exact workflow file in this repo, so no token or secret exists anywhere. Provenance is automatic.
# The publish job waits for ci.yml, run here as the gate: a push to main can carry commits no green PR run judged. One workflow holds the checks, so the gate cannot miss a CI step.
name: Publish

on:
  push:
    branches: [main]

# Releases must not interleave; serialize, and never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # semantic-release pushes tags and creates GitHub releases
  id-token: write # OIDC token for npm trusted publishing
  pull-requests: write # the retitle step edits the merged PR's title

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # semantic-release reads the full tag + commit history
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # npm (not bun) publishes: trusted publishing needs npm >= 11.5.1. bun cannot publish via OIDC or emit provenance.
      # setup-node reads the Node version from `devEngines.runtime` in package.json, the one place both release jobs take it from.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
      # Build once up front so dist/cli.js exists when npm first reads the manifest (silences "No bin file found"); prepack rebuilds it anyway after semantic-release writes the real version, so this copy is never what ships.
      - run: bun run build
      # The exact version changes only by a reviewed edit, and the `semantic-release-dry-run` job in ci.yml runs it on that edit's PR. OIDC publish needs >= 25.
      - run: npx semantic-release@26.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PRs to main are opened as "Release TBD" — the version does not exist until this run computes it. Once npm has the release, this step writes the real title ("Release v1.2.3") onto the PR whose merge triggered the run. Cosmetic and best-effort: by this point the release is already published, so a failure here must not paint the whole run red (continue-on-error).
      - name: Retitle the merged PR with the released version
        continue-on-error: true
        run: |
          git fetch --tags --quiet
          tag=$(git tag --points-at "$GITHUB_SHA" | grep '^v' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on $GITHUB_SHA — nothing was released; skipping"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no PR behind $GITHUB_SHA (direct push?); skipping"
            exit 0
          fi
          title="Release $tag"
          if [ "$(gh pr view "$pr" --json title --jq .title)" = "$title" ]; then
            echo "PR #$pr is already titled \"$title\""
          else
            gh pr edit "$pr" --title "$title"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
