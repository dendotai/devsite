# Publishes @den-ai/devsite to npm when a version tag (vX.Y.Z) is pushed.
# Auth is trusted publishing (OIDC): npmjs.com trusts this exact workflow file
# in this repo, so no token or secret exists anywhere. Provenance is automatic.
# The full CI gate runs again here: a tag can point at any commit, so the
# publish must not trust that CI already judged it.
name: Publish

on:
  push:
    tags: ["v[0-9]*"] # version tags only — a v2-experiment tag must not trigger

# Publishes must not interleave; serialize, and never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(jq -r .version package.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi
      # npm (not bun) publishes: trusted publishing needs npm >= 11.5.1, which
      # node 24 ships. bun cannot publish via OIDC or emit provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish
