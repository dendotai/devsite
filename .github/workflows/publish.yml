# Releases @den-ai/devsite from main. semantic-release computes the version
# from the commits since the last release tag (fix -> patch, feat -> minor,
# BREAKING CHANGE -> major), pushes the tag, writes GitHub release notes, and
# publishes to npm — or exits without releasing when nothing releasable landed.
# package.json stays at 0.0.0 on purpose: the real version lives in git tags
# and on npm, so no release commits ever land on main.
# Auth is trusted publishing (OIDC): npmjs.com trusts this exact workflow file
# in this repo, so no token or secret exists anywhere. Provenance is automatic.
# The full CI gate runs again here: a push to main may merge commits CI judged
# separately, so the release must not trust green PRs alone.
name: Publish

on:
  push:
    branches: [main]

# Releases must not interleave; serialize, and never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # semantic-release pushes tags and creates GitHub releases
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release reads the full tag + commit history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # npm (not bun) publishes: trusted publishing needs npm >= 11.5.1, which
      # node 24 ships. bun cannot publish via OIDC or emit provenance.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Major pinned: a new semantic-release major must arrive via a reviewed
      # edit here, not silently at the next release. OIDC publish needs >= 25.
      - run: npx semantic-release@25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
