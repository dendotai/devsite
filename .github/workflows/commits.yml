name: commits

# Checks what a PR writes into git history. It sits apart from ci.yml because it also runs on `edited`: a PR title edit reruns this check alone, not the whole CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit prefixes decide published versions (semantic-release), so every PR commit must parse as a conventional commit. Only where commits are born (PRs into dev): a dev->main promotion re-plays history that was already linted on its way into dev, plus pre-convention commits that can never be fixed.
  commitlint:
    if: github.base_ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # commitlint walks the PR's commit range
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # A squash merge of a PR with two or more commits writes the PR title as the commit subject, the one line semantic-release reads.
      - name: PR title
        if: success() || failure()
        run: bunx commitlint --verbose <<< "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
