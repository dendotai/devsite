# CI — every PR (and every push to dev/main) proves typecheck, lint, and
# tests. Repo-hygiene automation lives in maintenance.yml, deliberately kept
# separate: this workflow only judges code.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A superseded push to the same ref only wastes runner minutes — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # The published CLI must run under plain Node (engines.node floor), not
      # just under bun — build it and smoke-run the artifact.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run build
      - run: node dist/cli.js --help

  # Commit prefixes decide published versions (semantic-release), so every PR
  # commit must parse as a conventional commit. Only where commits are born
  # (PRs into dev): a dev->main promotion re-plays history that was already
  # linted on its way into dev, plus pre-convention commits that can never
  # be fixed.
  commitlint:
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commitlint walks the PR's commit range
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
