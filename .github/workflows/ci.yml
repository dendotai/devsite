# CI — every PR (and every push to dev/main) proves typecheck, lint, and tests. Repo-hygiene automation lives in maintenance.yml, deliberately kept separate: this workflow only judges code.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  # publish.yml runs this workflow as its gate, so a release runs the same checks as a PR.
  workflow_call:

permissions:
  contents: read

# A superseded push to the same ref only wastes runner minutes — cancel it.
# github.workflow is the caller's name in a called run, so the gate inside a publish run never cancels, or is cancelled by, the CI run of the same push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # setup-bun installs the latest Bun when `packageManager` names no version, so CI would run a Bun no one chose.
      - name: packageManager pins Bun
        run: jq -e '.packageManager | test("^bun@[0-9]+\\.[0-9]+\\.[0-9]+$")' package.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The reload test adapts devsite's Caddyfile with a real caddy binary.
      - run: gh release download "$(cat tests/CADDY_VERSION)" --repo caddyserver/caddy --pattern 'caddy_*_linux_amd64.tar.gz' --dir "$RUNNER_TEMP" && sudo tar -xzf "$RUNNER_TEMP"/caddy_*_linux_amd64.tar.gz -C /usr/local/bin caddy
        env:
          GH_TOKEN: ${{ github.token }}
      # The dnsmasq watcher tests run devsite's zsh script, and Ubuntu's runner image has no zsh.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - run: bun test
      # The published CLI must run under plain Node 22 (engines.node is >=22), not just under bun — build it and smoke-run the artifact.
      # One node version on purpose: only fs.glob is version-sensitive today. If the CLI grows more node-API surface, promote this to a small matrix (floor + current, e.g. [22, 24]).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.5
      - run: bun run build
      - run: node dist/cli.js --help

  # Runs publish.yml's semantic-release version in dry-run mode, so a version that cannot load the release config or its plugins fails its own PR instead of the next release on main.
  semantic-release-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the dry run still checks it may push (`git push --dry-run`); it pushes nothing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # semantic-release reads every tag and commit since the last release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The release config's preset (conventional-changelog-conventionalcommits) loads from the repo's node_modules.
      - run: bun install --frozen-lockfile
      # On a pull_request run, semantic-release reads the branch from GitHub's variables as `refs/pull/<n>/merge`, a branch no config lists, and exits before it checks anything. With GITHUB_ACTIONS unset it reads the branch from git instead: the PR head, checked out as a local branch of the same name, which `--branches` makes the release branch for this run.
      # `--plugins` leaves out @semantic-release/npm: its check exchanges a GitHub OIDC token for an npm token, and npmjs.com issues one only to publish.yml. The preset sits at the root of the release config, so it still reaches commit-analyzer and release-notes-generator.
      - run: |
          git checkout -B "$GITHUB_HEAD_REF"
          env -u GITHUB_ACTIONS bunx semantic-release@25.0.9 --dry-run --branches "$GITHUB_HEAD_REF" --plugins @semantic-release/commit-analyzer,@semantic-release/release-notes-generator,@semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
