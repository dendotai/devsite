<!doctype html>
<!--
  devsite "node not running" page — design source.

  Caddy answers this page itself when the devsite node does not run and no
  other machine takes the request.
  `devsite init` puts it into devsite.d/node.caddy as a Caddyfile heredoc,
  so no brace may be followed by a character other than a space or a
  newline: Caddy would read it as a placeholder.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>devsite · node not running</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 2.5rem 1.5rem;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.6;
    color: #ece4ee;
    background: #100f1c;
    display: grid;
    place-items: center;
  }

  main {
    width: min(60ch, 100%);
  }

  .brand {
    color: #ece4ee;
    font-weight: 600;
    letter-spacing: 0.04em;
    border-bottom: 1px solid #2b2638;
    padding-bottom: 0.9rem;
    margin-bottom: 2.2rem;
  }

  h1 {
    font-size: min(1.5rem, 5.4vw);
    font-weight: 600;
    line-height: 1.35;
    margin: 0 0 1rem;
  }

  p {
    margin: 0;
    color: #9a90a8;
  }

  code {
    color: #ffa070;
  }
</style>
</head>
<body>
<main>
  <header class="brand">devsite</header>
  <h1>the devsite node is not running</h1>
  <p>Run <code>bunx devsite doctor</code> on this Mac: it names the fix.</p>
</main>
</body>
</html>
